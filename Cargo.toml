[package]
name = "codex-relay"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Bounded coding workers with a local MCP and CLI interface"
license = "MIT"
repository = "https://github.com/nickmoylan/codex-relay"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
fs2 = "0.4"
libc = "0.2"
regex = "1"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "codex-relay"
path = "src/main.rs"

[profile.release]
lto = "thin"
strip = true
